name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate Android platform (com.fitness / 健身记录)
        run: python3 scripts/prepare_android.py

      - name: Build release APKs
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.log

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk fitness-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk fitness-armeabi-v7a.apk
          mv app-x86_64-release.apk fitness-x86_64.apk

      - name: Publish APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.9.15-fitness
          name: 健身记录 v4.9.15
          body: 自动构建的 APK，arm64-v8a 适用于荣耀 300 Pro 等 64 位安卓手机。
          files: |
            build/app/outputs/flutter-apk/fitness-arm64-v8a.apk
            build/app/outputs/flutter-apk/fitness-armeabi-v7a.apk
            build/app/outputs/flutter-apk/fitness-x86_64.apk

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.9.15-buildlog
          name: 构建日志
          files: build.log
